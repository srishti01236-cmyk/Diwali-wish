<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Happy Diwali in Advance ✨</title>
<style>
  :root{
    --gold:#ffd166;
    --maroon:#4a0e1c;
    --deep:#1a0b2e;
    --cream:#fff3d6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;
    font-family:'Segoe UI',system-ui,sans-serif;
    background:radial-gradient(circle at 50% 0%,#3d1650 0%,var(--deep) 55%,#0b0518 100%);
    color:var(--cream);
    overflow-x:hidden;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:40px 20px;
    text-align:center;
  }

  /* ---------- Confetti canvas ---------- */
  #confetti{
    position:fixed;inset:0;width:100%;height:100%;
    pointer-events:none;z-index:5;
  }

  /* ---------- Floating cat stickers ---------- */
  .cat{
    position:fixed;
    font-size:clamp(30px,5vw,52px);
    z-index:6;
    cursor:pointer;
    user-select:none;
    filter:drop-shadow(0 6px 12px rgba(0,0,0,.45));
    animation:float var(--dur,7s) ease-in-out infinite alternate;
    transition:transform .25s ease;
  }
  .cat:hover{transform:scale(1.35) rotate(-8deg)}
  @keyframes float{
    from{transform:translateY(0) rotate(var(--r,-6deg))}
    to{transform:translateY(-32px) rotate(calc(var(--r,-6deg) * -1))}
  }

  /* ---------- Content ---------- */
  .card{position:relative;z-index:10;max-width:720px}
  .badge{
    display:inline-block;
    letter-spacing:.22em;text-transform:uppercase;font-size:13px;
    color:var(--gold);border:1px solid rgba(255,209,102,.45);
    padding:8px 18px;border-radius:99px;background:rgba(255,209,102,.08);
    margin-bottom:22px;animation:pulse 2.6s ease-in-out infinite;
  }
  h1{
    font-size:clamp(38px,8vw,74px);line-height:1.05;font-weight:800;
    background:linear-gradient(90deg,#ff9a3c,var(--gold),#ffe9a8,var(--gold),#ff9a3c);
    background-size:300% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shine 5s linear infinite;
  }
  @keyframes shine{to{background-position:300% 0}}
  @keyframes pulse{50%{box-shadow:0 0 26px rgba(255,209,102,.4)}}

  p.sub{margin:18px auto 30px;max-width:520px;font-size:17px;opacity:.85;line-height:1.6}

  /* ---------- Diya row ---------- */
  .diyas{display:flex;gap:26px;justify-content:center;margin-bottom:34px}
  .diya{font-size:44px;position:relative;animation:bob 2.2s ease-in-out infinite}
  .diya:nth-child(2){animation-delay:.4s}
  .diya:nth-child(3){animation-delay:.8s}
  .diya::after{
    content:"";position:absolute;left:50%;top:-14px;width:14px;height:22px;
    transform:translateX(-50%);
    background:radial-gradient(circle at 50% 80%,#fff6c9 0%,#ffb703 45%,#fb5607 100%);
    border-radius:50% 50% 20% 20%;
    filter:blur(.6px);
    animation:flicker .18s ease-in-out infinite alternate;
  }
  @keyframes flicker{
    from{transform:translateX(-50%) scale(1) skewX(-4deg);opacity:.85}
    to{transform:translateX(-50%) scale(1.18) skewX(4deg);opacity:1}
  }
  @keyframes bob{50%{transform:translateY(-8px)}}

  button{
    font:inherit;font-weight:700;cursor:pointer;
    padding:15px 34px;border-radius:99px;border:none;
    background:linear-gradient(135deg,#ff9a3c,#ff5d8f);color:#fff;
    box-shadow:0 10px 30px rgba(255,93,143,.35);
    transition:transform .2s ease,box-shadow .2s ease;
  }
  button:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 16px 40px rgba(255,93,143,.5)}
  button:active{transform:scale(.97)}

  footer{margin-top:34px;font-size:14px;opacity:.6;letter-spacing:.04em}
</style>
</head>
<body>

<canvas id="confetti"></canvas>

<div class="card">
  <span class="badge">In Advance · Wishing You</span>
  <h1>Happy Diwali!</h1>
  <p class="sub">May your homes glow with diyas, your days with sweetness, and your heart with joy —
     long before the fireworks begin. 🪔</p>

  <div class="diyas">
    <div class="diya">🪔</div>
    <div class="diya">🪔</div>
    <div class="diya">🪔</div>
  </div>

  <button id="burst">Celebrate! 🎉</button>
  <footer>Click anywhere for confetti · Click a kitty for purr-ty time 🐾</footer>
</div>

<script>
/* ================= CONFETTI ================= */
const cvs = document.getElementById('confetti');
const ctx = cvs.getContext('2d');
let W, H;
const resize = () => { W = cvs.width = innerWidth; H = cvs.height = innerHeight; };
resize(); addEventListener('resize', resize);

const COLORS = ['#ffd166','#ff5d8f','#06d6a0','#ef476f','#ffb703','#8338ec','#3a86ff'];
let bits = [];

function spawn(x, y, count = 90, spread = 1){
  for (let i = 0; i < count; i++){
    const a = Math.random() * Math.PI * 2;
    const sp = (Math.random() * 9 + 3) * spread;
    bits.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 4,
      w: Math.random() * 9 + 4,
      h: Math.random() * 5 + 3,
      rot: Math.random() * Math.PI,
      vr: (Math.random() - .5) * .3,
      col: COLORS[Math.floor(Math.random() * COLORS.length)],
      shape: Math.random() < .3 ? 'circle' : 'rect',
      life: 1
    });
  }
}

/* Gentle ambient rain of confetti */
setInterval(() => {
  if (bits.length < 220) spawn(Math.random() * W, -20, 6, .4);
}, 500);

function loop(){
  ctx.clearRect(0, 0, W, H);
  bits.forEach((p, i) => {
    p.vy += .18;          // gravity
    p.vx *= .99;
    p.x += p.vx;
    p.y += p.vy;
    p.rot += p.vr;
    p.life -= .004;

    ctx.save();
    ctx.globalAlpha = Math.max(p.life, 0);
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.col;
    if (p.shape === 'circle'){
      ctx.beginPath(); ctx.arc(0, 0, p.w / 2, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    }
    ctx.restore();

    if (p.y > H + 40 || p.life <= 0) bits.splice(i, 1);
  });
  requestAnimationFrame(loop);
}
loop();

document.addEventListener('click', e => spawn(e.clientX, e.clientY, 70));
document.getElementById('burst').addEventListener('click', () => {
  spawn(W * .2, H * .4, 120, 1.4);
  spawn(W * .8, H * .4, 120, 1.4);
  spawn(W * .5, H * .2, 160, 1.6);
});

/* ================= CAT STICKERS ================= */
const CATS = ['🐱','😺','😸','🐈','🐈‍⬛','😻','🙀','😽','🐾','😹'];
for (let i = 0; i < 9; i++){
  const c = document.createElement('div');
  c.className = 'cat';
  c.textContent = CATS[i % CATS.length];
  c.style.left = (5 + Math.random() * 88) + 'vw';
  c.style.top  = (8 + Math.random() * 78) + 'vh';
  c.style.setProperty('--dur', (5 + Math.random() * 5).toFixed(1) + 's');
  c.style.setProperty('--r', (Math.random() * 24 - 12).toFixed(0) + 'deg');
  c.style.animationDelay = (-Math.random() * 5).toFixed(1) + 's';
  c.title = 'Purr-ty time!';
  c.addEventListener('click', ev => {
    ev.stopPropagation();
    const r = c.getBoundingClientRect();
    spawn(r.left + r.width / 2, r.top + r.height / 2, 45, .9);
    c.animate(
      [{transform:'scale(1)'},{transform:'scale(1.6) rotate(20deg)'},{transform:'scale(1)'}],
      {duration:450, easing:'ease-out'}
    );
  });
  document.body.appendChild(c);
}
</script>
</body>
</html>
